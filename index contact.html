    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f8fb;
            color: #222;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #01ABBA;
            padding: 0 32px;
        }
        .navbar ul {
            display: flex;
            gap: 24px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .navbar li a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            padding: 18px 0;
            transition: color 0.2s;
        }
        .navbar li a:hover {
            color: #222;
        }
        .navbar img {
            height: 40px;
            width: 40px;
            border-radius: 50%;
        }
        .contact-container {
            max-width: 500px;
            margin: 48px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(1,171,186,0.08);
            padding: 40px 32px;
        }
        h1 {
            text-align: center;
            color: #01ABBA;
            margin-bottom: 16px;
        }
        .contact-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .contact-list li {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            font-size: 1.08em;
        }
        .contact-list span {
            margin-left: 12px;
        }
        .contact-list a {
            color: #01ABBA;
            text-decoration: none;
        }
        .contact-list a:hover {
            text-decoration: underline;
        }
        .icon {
            font-size: 1.3em;
            width: 28px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .contact-container { padding: 24px 8px; }
            .navbar { flex-direction: column; gap: 8px; padding: 0 8px; }
        }
    </style>
